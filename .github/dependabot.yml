version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-runtime:
        patterns:
          - next
          - react
          - react-dom

  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /
      - /apps/api
      - /apps/runner
      - /apps/edge
      - /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
